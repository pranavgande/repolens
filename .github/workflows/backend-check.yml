name: Backend checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile $(find . -name "*.py" -not -path "./.venv/*")
      - name: Import fallback module
        run: python -c "from ai.fallback import execution_flow, folder_description, repository_summary; print('import: PASS')"
      - name: Test execution flow
        run: python -c "from ai.fallback import execution_flow; x=execution_flow('main.py','python','from fastapi import FastAPI\napp = FastAPI()\n',['routes/api.py']); assert 'Entry Point: main.py' in x and 'initializes the web application' in x and 'routes/api.py' in x; print('execution flow: PASS')"
      - name: Test folder description
        run: python -c "from ai.fallback import folder_description; assert folder_description('routes',['users.py'],'python') == 'contains request routing or API boundary code'; print('folder description: PASS')"
      - name: Test repository summary
        run: python -c "from ai.fallback import repository_summary; x=repository_summary('https://github.com/example/repo','python',12,'Layered','main.py',17,'  main.py (imported by 0 file(s))','None — clean architecture'); assert '12 analysed files' in x and 'main.py' in x and 'no detected circular dependencies' in x; print('repository summary: PASS')"
